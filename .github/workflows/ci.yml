name: "Python CI: Poset Operad Build & Test"

# Trigger the operational pipeline on every push or pull request to the main branch
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: "Containerized Engine Verification"
    runs-on: ubuntu-latest

    steps:
      # Step 1: Ingest the repository source code tree from GitHub into the worker
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      # Step 2: Set up a virtual Docker Buildx engine builder for high-velocity caching
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      # Step 3: Compile your exact custom multi-stage Docker compute image
      - name: "Build Container Image"
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: poset-operad-engine:latest
          outputs: type=docker,dest=/tmp/poset-operad-engine.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 4: Import the compiled image tarball back into the local Docker daemon
      - name: "Load Compiled Image"
        run: |
          docker load --input /tmp/poset-operad-engine.tar

      # Step 5: Boot up the container inside the cloud runner to execute your 61 tests
      - name: "Run Sandbox Test Suite"
        run: |
          docker run --rm poset-operad-engine
