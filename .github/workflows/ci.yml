name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pytest pytest-cov ruff mypy
          pip install -e ".[dev]" || echo "Editable install fallback applied"

      - name: Lint and Format Warnings (ruff)
        run: |
          ruff check poset_operad tests --fix || echo "Unsafe lint violations found, continuing pipeline..."
          ruff format poset_operad tests || echo "Unsafe format gaps skipped"
        continue-on-error: true

      - name: Type-check (mypy)
        run: mypy poset_operad --ignore-missing-imports
        continue-on-error: true

      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=poset_operad --cov-report=xml --tb=short -v
        env:
          PYTHONPATH: .

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
