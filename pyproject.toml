[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "poset-operad"
version = "0.1.0"
description = "Structural decomposition and isomorphism verification for poset matrices via the Poset Operad."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["poset", "operad", "order-theory", "combinatorics", "isomorphism"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "hypothesis>=6.100",
]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme",
    "myst-parser",
]

[project.urls]
Repository = "https://github.com/your-org/poset-operad"
Issues     = "https://github.com/your-org/poset-operad/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["poset_operad*"]

# ── Ruff (linting + formatting) ───────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "ANN"]
ignore  = ["D203", "D213", "ANN101"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "--tb=short -v --cov=poset_operad --cov-report=term-missing"

[tool.coverage.run]
source = ["poset_operad"]
omit   = ["tests/*", "benchmarks/*"]
